# One Nvoy participant identity: keyless watcher → keyed broker → keyless adapter.
#
# This is a template, not a hand-operated Compose file. Render it only with
# `node mcp/tools/render-instance-compose.mjs --instance <id> --image <digest>`
# so the runtime UID/GID, instance paths, and credential reference all come
# from the one validated manifest. Do not put an nsec in `environment`; Docker
# mounts source credentials only into the root-only initializer. It creates
# role-owned copies in separate private volumes: Bunker credentials for the broker, and,
# on a worker-enabled instance only, the model-provider credential for the worker.

# Renderer binds this Compose project name to the immutable instance ID. Named volumes are then
# namespaced per identity even when every rendered file is launched from the same directory.
name: nvoy-${INSTANCE_ID:?}

services:
  init:
    image: ${NVOY_IMAGE:?set NVOY_IMAGE}
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:mode=1777]
    environment:
      NVOY_INSTANCE_ROOT: /etc/nvoy/instances
      NVOY_BUNKER_URI_SOURCE: /run/secrets/bunker-uri
      NVOY_BUNKER_CLIENT_SOURCE: /run/secrets/bunker-client
      # @worker-begin
      NVOY_WORKER_PROVIDER_SOURCE: /run/secrets/worker-provider
      # @worker-end
      # @harness-begin
      NVOY_HARNESS_CREDENTIAL_SOURCE: /run/secrets/harness-credential
      # @harness-end
      # @webhook-begin
      NVOY_WAKE_WEBHOOK_URL_SOURCE: /run/secrets/wake-webhook-url
      NVOY_WAKE_WEBHOOK_HEADERS_SOURCE: /run/secrets/wake-webhook-headers
      # @webhook-end
    command: ["node", "mcp/tools/instance-runtime-init.mjs", "--instance", "${INSTANCE_ID:?}"]
    volumes:
      - type: bind
        source: ${MANIFEST_DIR:?}
        target: /etc/nvoy/instances
        read_only: true
      - type: volume
        source: watcher_spool
        target: ${SPOOL_DIR:?}
      - type: volume
        source: broker_state
        target: ${STATE_DIR:?}
      - type: volume
        source: adapter_runtime
        target: ${RUNTIME_DIR:?}
      - type: volume
        source: broker_credentials
        target: /run/nvoy-broker-credentials
      # @worker-begin
      - type: volume
        source: worker_credentials
        target: /run/nvoy-worker-credentials
      # @worker-end
      # @harness-begin
      - type: volume
        source: harness_credentials
        target: /run/nvoy-harness-credentials
      - type: volume
        source: harness_home
        target: /home/harness
      # @harness-end
      # @webhook-begin
      - type: volume
        source: wake_webhook_credentials
        target: /run/nvoy-wake-webhook-credentials
      - type: volume
        source: wake_webhook_state
        target: ${WAKE_WEBHOOK_STATE_DIR:?}
      # @webhook-end
    secrets:
      - source: nvoy_bunker_uri
        target: bunker-uri
      - source: nvoy_bunker_client
        target: bunker-client
      # @worker-begin
      - source: nvoy_worker_provider
        target: worker-provider
      # @worker-end
      # @harness-begin
      - source: nvoy_harness_credential
        target: harness-credential
      # @harness-end
      # @webhook-begin
      - source: nvoy_wake_webhook_url
        target: wake-webhook-url
      - source: nvoy_wake_webhook_headers
        target: wake-webhook-headers
      # @webhook-end
    restart: "no"

  watcher:
    image: ${NVOY_IMAGE:?set NVOY_IMAGE}
    user: "${WATCHER_UID:?}:${BROKER_ADAPTER_GID:?}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:mode=1777]
    environment:
      NVOY_INSTANCE_ROOT: /etc/nvoy/instances
    command: ["node", "mcp/tools/instance-runtime.mjs", "watch", "--instance", "${INSTANCE_ID:?}"]
    volumes:
      - type: bind
        source: ${MANIFEST_DIR:?}
        target: /etc/nvoy/instances
        read_only: true
      - type: volume
        source: watcher_spool
        target: ${SPOOL_DIR:?}
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  broker:
    image: ${NVOY_IMAGE:?set NVOY_IMAGE}
    user: "${BROKER_UID:?}:${BROKER_ADAPTER_GID:?}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:mode=1777]
    environment:
      NVOY_INSTANCE_ROOT: /etc/nvoy/instances
      NVOY_BUNKER_URI_FILE: /run/nvoy-broker-credentials/bunker-uri
      NVOY_BROKER_CREDENTIAL: /run/nvoy-broker-credentials/bunker-client
    command: ["node", "mcp/tools/instance-broker-daemon.mjs", "--instance", "${INSTANCE_ID:?}"]
    volumes:
      - type: bind
        source: ${MANIFEST_DIR:?}
        target: /etc/nvoy/instances
        read_only: true
      - type: volume
        source: broker_state
        target: ${STATE_DIR:?}
      - type: volume
        source: watcher_spool
        target: ${SPOOL_DIR:?}
      - type: volume
        source: adapter_runtime
        target: ${RUNTIME_DIR:?}
      - type: volume
        source: broker_credentials
        target: /run/nvoy-broker-credentials
        read_only: true
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  adapter:
    image: ${NVOY_IMAGE:?set NVOY_IMAGE}
    # Declared, not derived. The installed channel forced command must `docker exec` this exact
    # name, so it comes from the manifest rather than Compose's project/service/index rule (#154).
    container_name: ${ADAPTER_CONTAINER:?}
    user: "${ADAPTER_UID:?}:${BROKER_ADAPTER_GID:?}"
    group_add: ["${WORKER_HANDOFF_GID:?}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:mode=1777]
    environment:
      NVOY_INSTANCE_ROOT: /etc/nvoy/instances
    command: ["node", "mcp/tools/instance-adapter.mjs", "--instance", "${INSTANCE_ID:?}"]
    volumes:
      - type: bind
        source: ${MANIFEST_DIR:?}
        target: /etc/nvoy/instances
        read_only: true
      - type: volume
        source: adapter_runtime
        target: ${RUNTIME_DIR:?}
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
  # @worker-begin
  worker:
    image: ${WORKER_IMAGE:?}
    user: "${WORKER_UID:?}:${WORKER_HANDOFF_GID:?}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:mode=1777]
    environment:
      NVOY_INSTANCE_ROOT: /etc/nvoy/instances
      NVOY_WORKER_CREDENTIAL_FILE: /run/nvoy-worker-credentials/provider
      # The manifest UID is intentionally not the image's build-time user. Keep CLI state on the
      # worker's private tmpfs, never in a shared or image-persistent home directory.
      HOME: /tmp
    command: ["node", "mcp/tools/instance-worker.mjs", "--instance", "${INSTANCE_ID:?}", "--runner", "${WORKER_RUNNER:?}", "--daemon"]
    volumes:
      - type: bind
        source: ${MANIFEST_DIR:?}
        target: /etc/nvoy/instances
        read_only: true
      - type: volume
        source: adapter_runtime
        target: ${RUNTIME_DIR:?}
      - type: volume
        source: worker_credentials
        target: /run/nvoy-worker-credentials
        read_only: true
    depends_on:
      adapter:
        condition: service_started
    restart: unless-stopped
  # @worker-end
  # @harness-begin
  # The agent's own coding-agent session: Claude Code held open in tmux, or one persistent Codex
  # thread behind `codex app-server`. The keyless channel runs as its MCP child under the worker UID
  # and admitted envelopes are injected into the session; replies go back only as receipt ids
  # through the reply queue, so the broker still rechecks the grant and signs. No Nostr credential
  # reaches this container. Watch a Claude session with:
  #   docker exec -it <container> tmux -S /tmp/harness.sock attach -r
  harness:
    image: ${WORKER_IMAGE:?}
    user: "${WORKER_UID:?}:${WORKER_HANDOFF_GID:?}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:mode=1777]
    environment:
      NVOY_INSTANCE_ROOT: /etc/nvoy/instances
      NVOY_HARNESS_CREDENTIAL_FILE: /run/nvoy-harness-credentials/credential
      HOME: /home/harness
    command: ["node", "mcp/tools/instance-harness.mjs", "--instance", "${INSTANCE_ID:?}"]
    volumes:
      - type: bind
        source: ${MANIFEST_DIR:?}
        target: /etc/nvoy/instances
        read_only: true
      - type: volume
        source: adapter_runtime
        target: ${RUNTIME_DIR:?}
      - type: volume
        source: harness_credentials
        target: /run/nvoy-harness-credentials
        read_only: true
      - type: volume
        source: harness_home
        target: /home/harness
    depends_on:
      adapter:
        condition: service_started
    restart: unless-stopped
  # @harness-end
  # @webhook-begin
  # The webhook wake for a harness hosted off the fleet that cannot hold an SSH stream. It POSTs one
  # envelope id per new admitted envelope to the operator's HTTPS URL; the woken harness reads the
  # message over its channel key. It runs as the worker UID, the one that can read both the admitted
  # queue and the channel's read log, but it mounts the runtime read-only: it can write nothing there
  # except its own cursor volume, so it cannot touch the reply queue. It holds no Nostr credential and
  # no model login. Outbound HTTPS goes over the stack's default network.
  notifier:
    image: ${NVOY_IMAGE:?set NVOY_IMAGE}
    user: "${WORKER_UID:?}:${WORKER_HANDOFF_GID:?}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:mode=1777]
    environment:
      NVOY_INSTANCE_ROOT: /etc/nvoy/instances
      NVOY_WAKE_WEBHOOK_URL_FILE: /run/nvoy-wake-webhook-credentials/url
      NVOY_WAKE_WEBHOOK_HEADERS_FILE: /run/nvoy-wake-webhook-credentials/headers
    command: ["node", "mcp/tools/admitted-webhook-notify.mjs", "--instance", "${INSTANCE_ID:?}"]
    volumes:
      - type: bind
        source: ${MANIFEST_DIR:?}
        target: /etc/nvoy/instances
        read_only: true
      - type: volume
        source: adapter_runtime
        target: ${RUNTIME_DIR:?}
        read_only: true
      - type: volume
        source: wake_webhook_state
        target: ${WAKE_WEBHOOK_STATE_DIR:?}
      - type: volume
        source: wake_webhook_credentials
        target: /run/nvoy-wake-webhook-credentials
        read_only: true
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
  # @webhook-end

secrets:
  nvoy_bunker_uri:
    file: ${BUNKER_URI_FILE:?}
  nvoy_bunker_client:
    file: ${BUNKER_CLIENT_FILE:?}
  # @worker-begin
  # This is a model-provider credential (for example a dedicated OPENAI_API_KEY), not a
  # Nostr identity key. It is mounted only into the keyless worker and never into the broker.
  nvoy_worker_provider:
    file: ${WORKER_CREDENTIAL_FILE:?}
  # @worker-end
  # @harness-begin
  # The hosted harness's model login: a Claude Code token (`claude setup-token`) or, for a Codex
  # harness, an OpenAI API key. It is not a Nostr key and reaches only the harness, as a
  # worker-owned copy.
  nvoy_harness_credential:
    file: ${HARNESS_CREDENTIAL_FILE:?}
  # @harness-end
  # @webhook-begin
  # The operator's webhook URL and auth headers. Neither is a Nostr key; each reaches only the
  # notifier, as a worker-owned copy.
  nvoy_wake_webhook_url:
    file: ${WAKE_WEBHOOK_URL_FILE:?}
  nvoy_wake_webhook_headers:
    file: ${WAKE_WEBHOOK_HEADERS_FILE:?}
  # @webhook-end

volumes:
  watcher_spool: {}
  broker_state: {}
  adapter_runtime: {}
  broker_credentials: {}
  # @worker-begin
  worker_credentials: {}
  # @worker-end
  # @harness-begin
  harness_credentials: {}
  # The session's home, conversation history included, survives restarts: this is one specific,
  # continuing session, not a fresh one per task.
  harness_home: {}
  # @harness-end
  # @webhook-begin
  wake_webhook_credentials: {}
  # The notifier's envelope cursor, mounted over <runtime>/wake-webhook-state.
  wake_webhook_state: {}
  # @webhook-end
